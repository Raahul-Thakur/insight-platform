kind = "web"
previewPath = "/"
title = "Startup Intelligence Platform"
version = "1.0.0"
id = "artifacts/startup-intel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21526

[services.development]
run = "pnpm --filter @workspace/startup-intel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/startup-intel", "run", "build" ]
publicDir = "artifacts/startup-intel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21526"
BASE_PATH = "/"
